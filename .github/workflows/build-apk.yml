name: Build debug APK

# Собирает debug APK в облаке GitHub Actions — не требует Android SDK/Gradle на локальной
# машине. Полезно, если единственное доступное устройство — телефон: управлять сборкой
# можно целиком из мобильного браузера (запуск в Actions, скачивание готового APK из
# Artifacts). Использует системный Gradle из gradle/actions/setup-gradle, а не
# gradlew/gradle-wrapper.jar — последний сознательно не включён в репозиторий (бинарник,
# который негде было скачать при генерации проекта, см. PLAN.md §5.7); для CI это не
# проблема, а для локальной сборки Android Studio сгенерирует его сама при первом открытии.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proxyhunter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
